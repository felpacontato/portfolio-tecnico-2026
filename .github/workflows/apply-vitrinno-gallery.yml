name: Apply Vitrinno gallery update

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-vitrinno-gallery.yml
      - scripts/apply-vitrinno-gallery.py
      - public/assets/portfolio/vitrinno/gallery-*.jpg

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/update-vitrinno-gallery-20260729
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply image-only gallery update
        run: python3 scripts/apply-vitrinno-gallery.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual QA
        shell: bash
        run: |
          set -euo pipefail
          pnpm preview --host 127.0.0.1 --port 4187 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4187 >/dev/null; then
              break
            fi
            sleep 1
          done

          PORTFOLIO_BASE_URL=http://127.0.0.1:4187 pnpm qa:visual

          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const expectedImages = [
            '/assets/portfolio/vitrinno/gallery-feed.jpg',
            '/assets/portfolio/vitrinno/gallery-catalogo.jpg',
            '/assets/portfolio/vitrinno/gallery-studio.jpg',
            '/assets/portfolio/vitrinno/gallery-analytics.jpg',
            '/assets/portfolio/vitrinno/gallery-perfil.jpg',
          ];

          const browser = await chromium.launch({ headless: true });
          try {
            for (const viewport of [
              { width: 1440, height: 1000, label: 'desktop' },
              { width: 820, height: 1100, label: 'tablet' },
              { width: 390, height: 844, label: 'mobile' },
            ]) {
              const page = await browser.newPage({ viewport });
              await page.goto('http://127.0.0.1:4187', { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(3200);

              const result = await page.evaluate((expected) => {
                const article = document.querySelector('#vitrinno');
                const media = article?.querySelector('.project-media');
                const video = media?.querySelector(':scope > video.media-main');
                const source = video?.querySelector('source');
                const images = [...(media?.querySelectorAll('.media-grid img') || [])];
                const rects = images.map((image) => image.getBoundingClientRect());
                return {
                  poster: video?.getAttribute('poster'),
                  videoSource: source?.getAttribute('src'),
                  imageSources: images.map((image) => image.getAttribute('src')),
                  loaded: images.map((image) => image.complete && image.naturalWidth > 0),
                  visible: rects.map((rect) => rect.width > 30 && rect.height > 30),
                  overflow: document.documentElement.scrollWidth > window.innerWidth + 2,
                  expected,
                };
              }, expectedImages);

              const valid =
                result.poster === '/assets/portfolio/vitrinno/screen-01.png' &&
                result.videoSource === '/assets/portfolio/vitrinno/screen-01-loop.mp4' &&
                JSON.stringify(result.imageSources) === JSON.stringify(expectedImages) &&
                result.loaded.every(Boolean) &&
                result.visible.every(Boolean) &&
                !result.overflow;

              if (!valid) {
                throw new Error(`${viewport.label} Vitrinno QA failed: ${JSON.stringify(result)}`);
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          NODE

          for asset in \
            gallery-feed.jpg \
            gallery-catalogo.jpg \
            gallery-studio.jpg \
            gallery-analytics.jpg \
            gallery-perfil.jpg; do
            curl --fail --silent \
              "http://127.0.0.1:4187/assets/portfolio/vitrinno/$asset" \
              >/dev/null
          done

      - name: Remove one-off automation files
        run: |
          rm -f scripts/apply-vitrinno-gallery.py
          rm -f .github/workflows/apply-vitrinno-gallery.yml

      - name: Commit validated change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refresh Vitrinno portfolio images"
          git push origin HEAD:agent/update-vitrinno-gallery-20260729
