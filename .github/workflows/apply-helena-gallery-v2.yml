name: Run Helena gallery update

on:
  push:
    branches:
      - main
    paths:
      - helena-gallery-trigger.txt

permissions:
  contents: write

concurrency:
  group: helena-gallery-update
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Move uploaded Helena assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/portfolio/helena

          test -f Capturar.PNG
          test -f Capturar2.PNG
          test -f Capturar3.PNG
          test -f Capturar4.PNG
          test -f Capturar5.PNG
          test -f Capturar6.PNG
          test -f Capturar7.PNG
          test -f Capturar8.PNG
          test -f Capturar9.PNG
          test -f "helena-vdeo-execusão.mp4"

          mv Capturar.PNG public/assets/portfolio/helena/gallery-01.png
          mv Capturar2.PNG public/assets/portfolio/helena/gallery-02.png
          mv Capturar3.PNG public/assets/portfolio/helena/gallery-03.png
          mv Capturar4.PNG public/assets/portfolio/helena/gallery-04.png
          mv Capturar5.PNG public/assets/portfolio/helena/gallery-05.png
          mv Capturar6.PNG public/assets/portfolio/helena/gallery-06.png
          mv Capturar7.PNG public/assets/portfolio/helena/gallery-07.png
          mv Capturar8.PNG public/assets/portfolio/helena/gallery-08.png
          mv Capturar9.PNG public/assets/portfolio/helena/gallery-09.png
          mv "helena-vdeo-execusão.mp4" public/assets/portfolio/helena/helena-video-execucao.mp4

      - name: Update Helena section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index_path = Path("src/routes/index.tsx")
          source = index_path.read_text(encoding="utf-8")

          main_video = '''            <video class="media-main" autoplay muted loop playsinline preload="metadata" poster="/assets/portfolio/helena/screen-01.png" aria-label="Studio Helena Video">
                        <source src="/assets/portfolio/helena/screen-01-loop.mp4" type="video/mp4">
                      </video>'''
          if source.count(main_video) != 1:
              raise RuntimeError("Helena main video not found exactly once")

          helena_marker = '      <article id="helena" class="project-section">'
          lunna_marker = '      <article id="lunna-helena" class="project-section">'
          start = source.index(helena_marker)
          end = source.index(lunna_marker)
          block = source[start:end]

          if block.count(main_video) != 1:
              raise RuntimeError("Helena main video changed")
          if 'helena-showcase-video' in block:
              raise RuntimeError("Helena showcase already exists")

          grid_start = block.index('            <div class="media-grid">')
          grid_end = block.index('            </div>', grid_start) + len('            </div>')
          gallery = '''            <div class="media-grid">
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-01.png" aria-label="Abrir captura 1 do Helena Video"><img src="/assets/portfolio/helena/gallery-01.png" alt="Captura 1 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-02.png" aria-label="Abrir captura 2 do Helena Video"><img src="/assets/portfolio/helena/gallery-02.png" alt="Captura 2 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-03.png" aria-label="Abrir captura 3 do Helena Video"><img src="/assets/portfolio/helena/gallery-03.png" alt="Captura 3 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-04.png" aria-label="Abrir captura 4 do Helena Video"><img src="/assets/portfolio/helena/gallery-04.png" alt="Captura 4 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-05.png" aria-label="Abrir captura 5 do Helena Video"><img src="/assets/portfolio/helena/gallery-05.png" alt="Captura 5 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-06.png" aria-label="Abrir captura 6 do Helena Video"><img src="/assets/portfolio/helena/gallery-06.png" alt="Captura 6 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-07.png" aria-label="Abrir captura 7 do Helena Video"><img src="/assets/portfolio/helena/gallery-07.png" alt="Captura 7 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-08.png" aria-label="Abrir captura 8 do Helena Video"><img src="/assets/portfolio/helena/gallery-08.png" alt="Captura 8 do Helena Video"></button>
                        <button class="media-thumb" data-lightbox="/assets/portfolio/helena/gallery-09.png" aria-label="Abrir captura 9 do Helena Video"><img src="/assets/portfolio/helena/gallery-09.png" alt="Captura 9 do Helena Video"></button>
                      </div>'''
          block = block[:grid_start] + gallery + block[grid_end:]

          closing = '      </article>\n\n'
          if not block.endswith(closing):
              raise RuntimeError("Unexpected Helena section ending")

          showcase = '''        <div class="section-shell reveal helena-showcase-video" style="margin-top:clamp(42px,6vw,88px)">
                    <video controls playsinline preload="metadata" poster="/assets/portfolio/helena/gallery-01.png" aria-label="Demonstração completa da plataforma Helena Video" style="display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid rgba(139,255,191,.22);border-radius:clamp(18px,2.4vw,30px);background:#020706;box-shadow:0 30px 90px rgba(0,0,0,.48),0 0 60px rgba(44,255,145,.09)">
                      <source src="/assets/portfolio/helena/helena-video-execucao.mp4" type="video/mp4">
                      Seu navegador não suporta reprodução de vídeo.
                    </video>
                  </div>
          '''
          block = block[:-len(closing)] + showcase + closing
          updated = source[:start] + block + source[end:]

          if updated.count(main_video) != 1:
              raise RuntimeError("Helena main video changed unexpectedly")
          for number in range(1, 10):
              asset = f'/assets/portfolio/helena/gallery-{number:02d}.png'
              if block.count(asset) != 2:
                  raise RuntimeError(f"Invalid gallery reference count: {asset}")
          if block.count('/assets/portfolio/helena/helena-video-execucao.mp4') != 1:
              raise RuntimeError("Execution video reference missing")

          index_path.write_text(updated, encoding="utf-8")
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Validate assets and order
        shell: bash
        run: |
          set -euo pipefail
          for number in 01 02 03 04 05 06 07 08 09; do
            test -s "public/assets/portfolio/helena/gallery-${number}.png"
          done
          test -s public/assets/portfolio/helena/helena-video-execucao.mp4
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/routes/index.tsx").read_text(encoding="utf-8")
          helena = source.index('<article id="helena"')
          showcase = source.index('helena-showcase-video', helena)
          lunna = source.index('<article id="lunna-helena"')
          if not helena < showcase < lunna:
              raise RuntimeError("Execution video is not last in Helena section")
          PY

      - name: Commit validated update
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-helena-gallery.yml
          rm -f .github/workflows/apply-helena-gallery-v2.yml
          rm -f helena-gallery-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: refresh Helena gallery and add execution video"
          git push origin HEAD:main
