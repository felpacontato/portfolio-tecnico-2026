name: Remove final gallery residue

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/remove-gallery-residue.yml

permissions:
  contents: write

jobs:
  cleanup-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: agent/align-main-cleanup
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply final gallery cleanup
        run: python3 scripts/remove-gallery-residue.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual QA
        shell: bash
        run: |
          set -euo pipefail
          pnpm preview --host 127.0.0.1 --port 4187 > /tmp/portfolio-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4187 >/dev/null; then
              break
            fi
            sleep 1
          done

          PORTFOLIO_BASE_URL=http://127.0.0.1:4187 pnpm qa:visual || {
            cat /tmp/portfolio-preview.log
            exit 1
          }

      - name: Remove one-off automation files
        run: |
          rm -f scripts/remove-gallery-residue.py
          rm -f .github/workflows/remove-gallery-residue.yml

      - name: Commit validated residue cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove final circular gallery residue"
          git push origin HEAD:agent/align-main-cleanup
